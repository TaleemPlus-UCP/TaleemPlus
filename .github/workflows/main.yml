name: TaleemPlus CI/CD 🚀

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint & Test (Flutter) 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Format
        run: dart format --set-exit-if-changed lib

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Unit Tests
        run: flutter test --coverage

  backend-qa:
    name: Lint, Build & Test (Backend) 🧪
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taleemplus_app
          POSTGRES_PASSWORD: TaleemPlus_Dev_2026!
          POSTGRES_DB: taleemplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check / Build
        run: npm run build

      - name: Create test environment file
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=4001
          API_PREFIX=/api/v1
          CORS_ORIGINS=

          DATABASE_URL="postgresql://taleemplus_app:TaleemPlus_Dev_2026!@localhost:5432/taleemplus_test?schema=public"

          JWT_ACCESS_SECRET=test-access-secret-please-do-not-use-in-prod-0000000000
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=test-refresh-secret-please-do-not-use-in-prod-000000000
          JWT_REFRESH_EXPIRES_IN=30d

          PASSWORD_RESET_TOKEN_EXPIRES_MIN=30
          CLIENT_RESET_PASSWORD_URL=https://app.taleemplus.com/reset-password

          SMTP_HOST=
          SMTP_PORT=587
          SMTP_SECURE=false
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM_NAME=TaleemPlus
          SMTP_FROM_EMAIL=no-reply@taleemplus.app

          CLOUDINARY_CLOUD_NAME=
          CLOUDINARY_API_KEY=
          CLOUDINARY_API_SECRET=

          RATE_LIMIT_WINDOW_MIN=15
          RATE_LIMIT_MAX=10000
          AUTH_RATE_LIMIT_WINDOW_MIN=15
          AUTH_RATE_LIMIT_MAX=10000

          LOG_LEVEL=error
          EOF

      - name: Run Tests
        run: npm test

  build-android:
    name: Android Release 🤖
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (direct-download artifact)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (Play Store artifact)
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/*.aab

  build-web:
    name: Web Deployment 🌐
    needs: qa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.PRODUCTION_API_BASE_URL }}

      # Static hosting only (no Firestore/Firebase Auth dependency left in
      # the app) — keep, switch, or drop this step per wherever the web
      # build actually gets hosted; unrelated to the backend migration.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALEEMPLUS_40755 || secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: taleemplus-40755

  create-release:
    name: Create GitHub Release 📦
    needs: [build-android, build-web, backend-qa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: apk

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: android-release-aab
          path: aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apk/*.apk
            aab/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
