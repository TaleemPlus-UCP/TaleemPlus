name: Backend CI

on:
  push:
    branches: [ main, master, feature/firebase-to-node-postgresql ]
  pull_request:
    branches: [ main, master, feature/firebase-to-node-postgresql ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./taleemplus_backend

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taleemplus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './taleemplus_backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        run: |
          npx prisma generate
          npx prisma migrate dev --name init
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/taleemplus_db?schema=public"

      - name: Run Jest Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/taleemplus_db?schema=public"
          JWT_SECRET: "ci_jwt_secret_key"
          REFRESH_TOKEN_SECRET: "ci_refresh_secret_key"
