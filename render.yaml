databases:
  - name: taleemplus-db
    databaseName: taleemplus
    user: taleemplus_app
    plan: free

services:
  - type: web
    name: taleemplus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taleemplus-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Comma-separated allowlist of the actual frontend origin(s) — the
      # server refuses to boot in production if this is empty. Fill in
      # after the Firebase Hosting URL (or your web domain) is known.
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_TOKEN_EXPIRES_MIN
        value: "30"
      - key: CLIENT_RESET_PASSWORD_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: TaleemPlus
      - key: SMTP_FROM_EMAIL
        value: no-reply@taleemplus.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: AUTH_RATE_LIMIT_WINDOW_MIN
        value: "15"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: LOG_LEVEL
        value: info
